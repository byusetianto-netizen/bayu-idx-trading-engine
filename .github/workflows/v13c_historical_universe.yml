name: V1.3C Historical Universe Probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  historical_universe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy

      - name: Build historical universe probe
        run: |
          python historical_security_master.py

      - name: Commit audit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historical_security_master.csv
          git add data/historical_universe_gap_flags.csv
          git add data/historical_universe_summary.json
          git add data/historical_universe_status.json
          git diff --cached --quiet || git commit -m "Add V1.3C historical universe probe"
          git push
