name: V1.3C-3 Evidence Reconciliation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas

      - name: Reconcile universe evidence
        run: python historical_universe_reconciliation.py

      - name: Commit audit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historical_universe_reconciliation.csv
          git add data/historical_universe_review_queue.csv
          git add data/historical_universe_reconciliation_summary.json
          git add data/historical_universe_reconciliation_status.json
          git diff --cached --quiet || git commit -m "Add V1.3C-3 universe evidence reconciliation"
          git push
