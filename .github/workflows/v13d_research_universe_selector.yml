name: V1.3D Research Universe Selector

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Build research universe
        run: python research_universe_selector.py

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research_universe.csv \
                  data/research_universe_review_queue.csv \
                  data/research_universe_summary.json \
                  data/research_universe_status.json
          git diff --cached --quiet || git commit -m "Add V1.3D research universe selector"
          git push
