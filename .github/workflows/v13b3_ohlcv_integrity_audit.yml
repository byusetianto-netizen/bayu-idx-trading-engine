name: V1.3B-3 OHLCV Integrity Audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Run V1.3B-3 OHLCV integrity audit
        run: |
          python data_quality_ohlcv_audit.py --data-dir data --min-rows-a 500 --max-gap-days 45

      - name: Commit audit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ohlcv_integrity_audit.csv data/ohlcv_integrity_summary.json
          git diff --cached --quiet || git commit -m "V1.3B-3 OHLCV integrity audit"
          git push
