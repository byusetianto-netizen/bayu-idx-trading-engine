name: Daily IDX Data Update

on:
  workflow_dispatch:
  schedule:
    # 18:30 WIB (UTC+7), Monday-Friday, after the IDX session
    - cron: "30 11 * * 1-5"

permissions:
  contents: write

concurrency:
  group: idx-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build BEI universe audit
        run: |
          python universe_update.py
          python universe_audit.py

      - name: Update market data
        run: python data_update.py

      - name: Recalculate trading engine
        run: python actual_engine.py

      - name: Publish latest engine outputs
        run: |
          cp data/engine_output/latest_actual_radar.csv data/latest_actual_radar.csv
          cp data/engine_output/model_validation_metrics.csv data/model_validation_metrics.csv

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/idx_stock_prices.csv
          git add data/idx_ihsg_index.csv
          git add data/latest_actual_radar.csv
          git add data/model_validation_metrics.csv
          git add data/update_manifest.json
          git add data/security_master.csv
          git add data/universe_audit.csv
          git add data/universe_status.json
          git add data/universe_audit_summary.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Auto-update IDX data, universe audit and trading radar"
            git push
          fi
