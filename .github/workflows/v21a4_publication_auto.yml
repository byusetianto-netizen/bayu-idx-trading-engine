name: V2.1A4 Automatic IDX Publication Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '45 13 * * 1-5' # 20:45 WIB

permissions:
  contents: write

jobs:
  publication-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Collect IDX publication evidence
        run: python scripts/collect_idx_publication_evidence.py

      - name: Validate PIT publication evidence
        run: python scripts/validate_pit_publication_evidence.py

      - name: Commit evidence outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fundamental/publication_evidence.csv data/fundamental/publication_collection_status.json data/fundamental/publication_collection_raw.json data/fundamental/pit_publication_validation.json
          git diff --cached --quiet || git commit -m "chore: refresh IDX publication evidence"
          git push
