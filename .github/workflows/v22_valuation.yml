name: V2.2 Valuation Engine Complete
on:
  workflow_dispatch:
  schedule:
    - cron: "30 14 * * 1-5" # 21:30 WIB
permissions:
  contents: write
jobs:
  valuation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy yfinance
      - name: Ensure PIT price coverage
        run: python scripts/ensure_valuation_price_coverage.py
      - name: Build complete valuation engine
        run: python scripts/valuation_engine.py
      - name: Validate valuation
        run: python scripts/validate_valuation.py
      - name: Commit valuation outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/valuation
          git diff --cached --quiet || git commit -m "Build complete valuation research outputs"
          git push
