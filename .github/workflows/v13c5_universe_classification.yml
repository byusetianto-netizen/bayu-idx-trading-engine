name: V1.3C-5 Universe Classification

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Build classification layer
        run: python universe_classification.py

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/universe_classification.csv \
                  data/universe_classification_review_queue.csv \
                  data/universe_classification_summary.json \
                  data/universe_classification_status.json
          git diff --cached --quiet || git commit -m "Add V1.3C-5 universe classification"
          git push
