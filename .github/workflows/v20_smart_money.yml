name: V2.0 Smart Money Research

on:
  workflow_dispatch:
    inputs:
      max_tickers:
        description: "Max ticker quota to consume"
        required: false
        default: "5"
  schedule:
    - cron: "30 12 * * 1-5"

permissions:
  contents: write

jobs:
  smart-money:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Collect broker summary
        env:
          INDEXALPHA_API_KEY: ${{ secrets.INDEXALPHA_API_KEY }}
          MAX_TICKERS_PER_DAY: ${{ github.event.inputs.max_tickers || '5' }}
          BATCH_SIZE: "50"
          LOOKBACK_DAYS: "1"
        run: python broker_summary_collector.py

      - name: Build broker flow features
        run: python broker_flow_engine.py

      - name: Build phase features
        run: python flow_phase_engine.py

      - name: Run validation
        run: python v20_validation.py

      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/broker
          git diff --cached --quiet || git commit -m "V2.0 smart money research update"
          git push
