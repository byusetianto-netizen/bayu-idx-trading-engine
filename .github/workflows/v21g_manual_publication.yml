name: V2.1G Manual Publication Evidence

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas

      - name: Build publication evidence
        run: python scripts/build_publication_evidence.py

      - name: Validate publication input
        run: python scripts/validate_publication_input.py

      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fundamental/publication_input.csv data/fundamental/publication_evidence.csv data/fundamental/publication_manual_status.json data/fundamental/publication_manual_validation.json
          git diff --cached --quiet || git commit -m 'Add manual publication evidence'
          git push
