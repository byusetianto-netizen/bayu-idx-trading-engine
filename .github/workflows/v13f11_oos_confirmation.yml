
name: V1.3F-11 Out-of-Sample Confirmation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oos-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.2.6 \
            pandas==2.2.3 \
            scikit-learn==1.6.1 \
            scipy==1.15.3 \
            tabulate==0.9.0

      - name: Record runtime versions
        run: |
          python --version
          python -c "import numpy, pandas, sklearn, scipy; print('numpy:', numpy.__version__); print('pandas:', pandas.__version__); print('scikit-learn:', sklearn.__version__); print('scipy:', scipy.__version__)"

      - name: Compile research scripts
        run: |
          python -m py_compile v13f11_calendar_integrity.py
          python -m py_compile v13f11_calendar_sensitivity.py
          python -m py_compile v13f11_weekly_walkforward.py
          python -m py_compile v13f11_weekly_retraining.py
          python -m py_compile v13f11_oos_confirmation.py

      - name: Stage A - Calendar integrity prerequisite
        run: |
          python v13f11_calendar_integrity.py

      - name: Stage F4 - Out-of-sample confirmation
        run: |
          python -u v13f11_oos_confirmation.py

      - name: Upload F4 research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v13f11-oos-confirmation-research
          path: |
            data/execution_probe/v13f11_oos_confirmation_summary.json
            data/execution_probe/v13f11_oos_confirmation_detail.csv
            data/execution_probe/v13f11_oos_confirmation_weekly.csv
            data/execution_probe/v13f11_calendar_integrity_summary.json
          if-no-files-found: warn
          retention-days: 30
