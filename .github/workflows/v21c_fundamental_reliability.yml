name: V2.1C Fundamental Reliability
on:
  workflow_dispatch:
  schedule:
    - cron: '00 14 * * 1-5' # 21:00 WIB
permissions:
  contents: write
jobs:
  reliability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build coverage status
        run: python scripts/build_fundamental_coverage.py
      - name: Validate PIT readiness
        run: python scripts/validate_fundamental_reliability.py
      - name: Commit reliability outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fundamental/fundamental_coverage_status.json data/fundamental/fundamental_reliability_status.json
          git diff --cached --quiet || git commit -m "Update fundamental reliability status"
          git push
