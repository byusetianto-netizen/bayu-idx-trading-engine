name: V2.1D Fundamental Coverage Expansion

on:
  workflow_dispatch:
  schedule:
    - cron: '15 13 * * 1-5'

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install pandas numpy openpyxl

      - name: Build coverage queue
        run: python scripts/build_financial_coverage_queue.py

      - name: Validate coverage
        run: python scripts/validate_financial_coverage.py

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fundamental/acquisition_queue.csv data/fundamental/coverage_expansion_status.json data/fundamental/coverage_validation_status.json
          git diff --cached --quiet || git commit -m "Build V2.1 fundamental coverage queue"
          git push
