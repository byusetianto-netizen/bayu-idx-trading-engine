name: V1.3B-2 Data Quality Audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Run V1.3B-2 data quality audit
        run: |
          python data_quality_audit.py --data-dir data --min-rows-a 500 --min-rows-b 200 --max-lag-days-a 10 --max-gap-days-a 45

      - name: Commit audit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/price_data_quality_audit.csv data/price_data_quality_summary.json data/price_data_quality_status.json
          git diff --cached --quiet || git commit -m "V1.3B-2 data quality audit"
          git push
