name: V1.3B-4 Session Coverage Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas

      - name: Run V1.3B-4 session coverage diagnostic
        run: |
          python session_coverage_diagnostic.py --data-dir data --top-examples 30

      - name: Commit diagnostic outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/session_coverage_diagnostic.csv data/session_coverage_summary.json data/session_coverage_examples.csv
          git diff --cached --quiet || git commit -m "V1.3B-4 session coverage diagnostic"
          git push
