name: V2.1B Fundamental Metrics

on:
  workflow_dispatch:
    inputs:
      analysis_date:
        description: "Point-in-Time analysis date (YYYY-MM-DD)"
        required: true
        default: "2026-09-01"

  schedule:
    - cron: '00 14 * * 1-5' # 21:00 WIB

permissions:
  contents: write

jobs:
  fundamental-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Resolve analysis date
        id: analysis
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ANALYSIS_DATE="${{ inputs.analysis_date }}"
          else
            ANALYSIS_DATE="$(date -u +%F)"
          fi

          echo "analysis_date=$ANALYSIS_DATE" >> "$GITHUB_OUTPUT"
          echo "Using analysis date: $ANALYSIS_DATE"

      - name: Build fundamental metrics
        run: >
          python scripts/fundamental_metrics_engine.py
          --analysis-date "${{ steps.analysis.outputs.analysis_date }}"

      - name: Validate fundamental metrics
        run: >
          python scripts/validate_fundamental_metrics.py
          --source data/fundamental/financial_statements_pit.csv
          --analysis-date "${{ steps.analysis.outputs.analysis_date }}"

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fundamental/fundamental_metrics.csv data/fundamental/fundamental_assessment.csv data/fundamental/fundamental_metrics_status.json data/fundamental/fundamental_metrics_validation.json
          git diff --cached --quiet || git commit -m "V2.1B: build fundamental metrics"
          git push