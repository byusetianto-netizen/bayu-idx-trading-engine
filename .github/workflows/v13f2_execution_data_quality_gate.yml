name: V1.3F-2 Execution Data Quality Gate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Run V1.3F-2 execution data quality gate
        run: python execution_data_quality_gate.py

      - name: Commit quality-gate outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/execution_probe/execution_quality_gate.csv
          git add data/execution_probe/execution_quality_issues.csv
          git add data/execution_probe/execution_quality_summary.json
          git diff --cached --quiet || git commit -m "V1.3F-2 execution data quality gate"
          git push