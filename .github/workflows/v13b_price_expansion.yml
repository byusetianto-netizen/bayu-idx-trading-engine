name: V1.3B Price Expansion Probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run V1.3B price expansion probe
        run: |
          python price_universe_expansion.py --years 3 --workers 6 --min-rows 200 --max-lag-days 10

      - name: Commit V1.3B candidate outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/idx_stock_prices_expansion.csv
          git add data/price_expansion_audit.csv
          git add data/price_expansion_status.json

          if git diff --cached --quiet; then
            echo "No V1.3B output changes to commit."
          else
            git commit -m "V1.3B price expansion probe"
            git push
          fi
