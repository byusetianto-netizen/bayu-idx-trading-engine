name: V1.3E-1 Robust Universe Validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Run robust validation
        run: python universe_robust_validation.py

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/universe_robust_validation_stats.csv \
                  data/universe_robust_validation_comparison.csv \
                  data/universe_robust_validation_summary.json \
                  data/universe_robust_validation_status.json
          git diff --cached --quiet || git commit -m "Add V1.3E-1 robust universe validation"
          git push
