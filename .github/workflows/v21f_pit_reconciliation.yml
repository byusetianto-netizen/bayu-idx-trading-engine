name: V2.1F PIT Reconciliation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Reconcile PIT evidence
        run: python scripts/reconcile_pit_evidence.py

      - name: Validate PIT reconciliation
        run: python scripts/validate_pit_reconciliation.py

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fundamental/financial_statements_pit.csv data/fundamental/pit_reconciliation_audit.csv data/fundamental/pit_reconciliation_status.json data/fundamental/pit_reconciliation_validation_status.json
          git diff --cached --quiet || git commit -m "Build PIT financial reconciliation"
          git push
