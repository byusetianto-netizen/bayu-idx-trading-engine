name: V1.3F-3 Trading Calendar Reconciliation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.2,<3.0"

      - name: Run V1.3F-3 calendar reconciliation
        run: |
          python trading_calendar_reconciliation.py

      - name: Show reconciliation summary
        run: |
          cat data/execution_probe/trading_calendar_reconciliation_summary.json

      - name: Verify outputs exist
        run: |
          test -f data/execution_probe/trading_calendar_reconciliation.csv
          test -f data/execution_probe/trading_calendar_reconciliation_summary.json

      - name: Commit generated audit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/execution_probe/trading_calendar_reconciliation.csv \
            data/execution_probe/trading_calendar_reconciliation_summary.json

          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "data: update V1.3F-3 calendar reconciliation"
            git push
          fi